<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Cài đặt Đồng Hồ LED</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="card">
    <h2>Cài đặt Đồng Hồ LED</h2>
    <div id="currentTime"></div>
    <a href="/connectwifi" class="wifi-btn">Kết nối WiFi</a>
    <form id="setupForm">
      <label for="chour">Màu Giờ:</label>
      <input id="chour" type="color" name="chour" value="#ffffff">
      <label for="cmin">Màu Phút:</label>
      <input id="cmin" type="color" name="cmin" value="#ffffff">
      <label for="csec">Màu Giây:</label>
      <input id="csec" type="color" name="csec" value="#ffffff">
      <label for="cmark">Màu mốc 12/3/6/9:</label>
      <input id="cmark" type="color" name="cmark" value="#000000">

      <label for="minute_effect">Thời gian hiệu ứng phút (ms):</label>
      <input id="minute_effect" type="number" name="minute_effect" min="1000" max="10000" step="1000" value="2000">

      <label for="hour_effect">Thời gian hiệu ứng giờ (ms):</label>
      <input id="hour_effect" type="number" name="hour_effect" min="1000" max="10000" step="1000" value="3000">

      <label for="effect_start">Bắt đầu hiệu ứng phút/giờ:</label>
      <input id="effect_start" type="time" name="effect_start" value="00:00" required>

      <label for="effect_end">Kết thúc hiệu ứng phút/giờ:</label>
      <input id="effect_end" type="time" name="effect_end" value="23:59" required>
      <small>Hiệu ứng hoạt động trong khung giờ đã chọn, kể cả khi khung giờ qua nửa đêm.</small>

      <hr style="margin:20px 0; border:1px solid #333;">
      <h3>Độ sáng LED</h3>
      <label for="brightness">Độ sáng LED:</label>
      <input id="brightness" type="range" name="brightness" min="0" max="255" value="255">
      <span id="brightness_value">255</span>


      <hr style="margin:20px 0; border:1px solid #333;">
      <h3>Hiệu ứng khi chuyển phút/giờ</h3>

      <label for="eff_minute">Hiệu ứng chuyển phút:</label>
      <select id="eff_minute" name="eff_minute">
        <option value="0">Tắt</option>
        <option value="1">Cầu vồng</option>
        <option value="2">Sao băng</option>
        <option value="3">Nhịp thở</option>
        <option value="4">Đổi màu ngẫu nhiên</option>
        <option value="5">Chớp nháy</option>
        <option value="6">Lửa</option>
        <option value="7">Đuổi màu</option>
        <option value="8">Lấp lánh</option>
        <option value="9">Cầu vồng quét và fade</option>
      </select>

      <label for="eff_hour">Hiệu ứng chuyển giờ:</label>
      <select id="eff_hour" name="eff_hour">
        <option value="0">Tắt</option>
        <option value="1">Cầu vồng</option>
        <option value="2">Sao băng</option>
        <option value="3">Nhịp thở</option>
        <option value="4">Đổi màu ngẫu nhiên</option>
        <option value="5">Chớp nháy</option>
        <option value="6">Lửa</option>
        <option value="7">Đuổi màu</option>
        <option value="8">Lấp lánh</option>
        <option value="9">Cầu vồng quét và fade</option>
      </select>

      <hr style="margin:20px 0; border:1px solid #333;">

      <label for="gmt_offset">Múi giờ GMT:</label>
      <input id="gmt_offset" type="number" name="gmt_offset" min="-12" max="14" step="1" value="7">

      <button type="submit" id="btnSave">Lưu cài đặt</button>
    </form>
    <div id="saveResult" style="margin-top: 10px; color: #40c9ff;"></div>
    
    <div class="card-footer">
      <strong>Hostname mạng:</strong> clock-led
    </div>
  </div>
  <script src="/app.js"></script>
</body>

</html>
